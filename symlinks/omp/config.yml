modelRoles:
  default: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna:xhigh
  slow: openai-codex/gpt-6-astra:medium
  task: openai-codex/gpt-6.1-sol:medium
  advisor: openai-codex/gpt-6-astra:medium
  tiny: openai-codex/gpt-6-luna:medium
  memory: openai-codex/gpt-6-luna:high
  plan: openai-codex/gpt-6.1-sol:xhigh
symbolPreset: nerd
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-tundra
  light: dark-tundra
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - pr
    - context_tokens
    - status
  rightSegments:
    - session_name
  compactThinkingLevel: true
  showHookStatus: false
terminal:
  showProgress: true
tui:
  textSizing: true
display:
  hideToolActivity: true
hideThinkingBlock: true
cycleOrder:
  - default
  - smol
  - slow
dev:
  autoqaConsent: granted
disabledProviders:
  - claude
  - claude-plugins
  - codex
  - gemini
  - opencode
commands:
  enableOpencodeProject: false
  enableClaudeProject: false
retry:
  waitForUsageReset: true
title:
  icons: boring
steeringMode: all
followUpMode: all
interruptMode: wait
treeFilterMode: no-tools
completion:
  notify: "off"
error:
  notify: "on"
recap:
  idleSeconds: 600
collab:
  displayName: krikchaip
features:
  unexpectedStopDetection: smart