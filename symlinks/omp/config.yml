modelRoles:
  default: openai-codex/gpt-6.1-sol:high
  smol: openai-codex/gpt-6-luna:high
  slow: openai-codex/gpt-6-astra:medium
  task: openai-codex/gpt-6.1-sol:medium
  advisor: openai-codex/gpt-6-astra:medium
symbolPreset: nerd
composer:
  shape: claude
  tokenRate: true
theme:
  dark: dark-tundra
setupVersion: 2
statusLine:
  preset: custom
  leftSegments:
    - pi
    - vim
    - model
    - mode
    - collab
    - stream
    - pr
    - context_tokens
  rightSegments:
    - session_name
  compactThinkingLevel: true
terminal:
  showProgress: true
tui:
  textSizing: true
display:
  hideToolActivity: true
hideThinkingBlock: true
cycleOrder:
  - default
  - smol
  - slow
dev:
  autoqaConsent: granted