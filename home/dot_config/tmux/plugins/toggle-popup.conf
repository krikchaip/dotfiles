# tmux 3.8 gives popups an opaque theme background by default.
# The host draws the popup; keep its background at the terminal default.
set -g popup-style "bg=default,fg=default"

set -g @popup-on-init {
  set exit-empty off
  set status off
  set -g prefix C-a
  bind C-a send-prefix

  # This callback runs on each popup open. Refresh only its existing image owner.
  if -F '#{@yazi-kitty-socket}' {
    run-shell -b 'python3 ~/.config/yazi/plugins/kitty-popup.yazi/main.py refresh "#{@yazi-kitty-socket}"'
  }
}

set -g @popup-id-format "#{b:socket_path}/#{session_name}/{popup_name}"

bind -N "[Pane] Toggle floating" f   run-shell "#{@popup-toggle} --toggle-key '-n C-z' --name=floating -d '##{pane_current_path}' -E"
bind -N "[Pane] Toggle floating" C-f run-shell "#{@popup-toggle} --toggle-key '-n C-z' --name=floating -d '##{pane_current_path}' -E"

bind -N "[Popup] Open Quick Chat" c   run-shell "#{@popup-toggle} --toggle-key '-n C-z' --toggle-key '-n C-d' -w 60% -h 60% --id=pi_popup -E 'nucmd pi-tmux-popup'"
bind -N "[Popup] Open Quick Chat" C-c run-shell "#{@popup-toggle} --toggle-key '-n C-z' --toggle-key '-n C-d' -w 60% -h 60% --id=pi_popup -E 'nucmd pi-tmux-popup'"

bind -n -N "[Popup] Open yazi at \$PWD" M-y run-shell "#{@popup-toggle} --toggle-key '-n C-z' --toggle-key '-n M-y' -w 80% --name=yazi_pwd -d '##{pane_current_path}' -E 'python3 ~/.config/yazi/plugins/kitty-popup.yazi/main.py run'"

# One lazygit popup per Git root (or per folder outside a repo), shared by all sessions.
# pane_current_path follows Neovim's :cd and :tcd, so NvChad panes need no special case.
bind -n -N "[Popup] Open lazygit at the Git root of \$PWD" M-g run-shell 'dir=#{q:pane_current_path}; root=$(git -C "$dir" rev-parse --show-toplevel 2>/dev/null || printf "%s" "$dir"); exec #{@popup-toggle} --toggle-key "-n M-g" -w 80% -h 80% --id="lazygit$root" -d "$root" -E lazygit-recent'

# vim:ft=tmux.chezmoitmpl
