id = "dotfiles.navigation"
name = "Navigation"
version = "1.3.0"
min_herdr_version = "0.9.5"
description = "Navigate recent tabs and workspaces, and move live tabs or panes"
platforms = ["macos", "linux"]

[[actions]]
id = "last-tab"
title = "Go to last active tab"
description = "Toggle recent open tabs within the current workspace; scan at most 256 KiB"
contexts = ["workspace"]
command = ["python3", "navigation.py", "last-tab"]

[[actions]]
id = "last-workspace"
title = "Go to last active workspace"
description = "Toggle recent open workspaces within this session; scan at most 256 KiB"
contexts = ["workspace"]
command = ["python3", "navigation.py", "last-workspace"]

[[actions]]
id = "move-tab"
title = "Move tab"
description = "Move the current tab and its live panes to another or a new workspace"
contexts = ["workspace"]
command = ["python3", "move_ui.py", "open"]

[[actions]]
id = "move-pane"
title = "Move focused pane"
description = "Browse workspaces and tabs, or create a destination for the focused pane"
contexts = ["workspace"]
command = ["python3", "pane_ui.py", "open"]

[[actions]]
id = "finish-move"
title = "Finish pending move"
description = "Finish a queued tab or pane move after its popup closes"
contexts = ["workspace"]
command = ["python3", "finish_move.py"]

# Continue the frame before each title so its text aligns with popup content.
[[panes]]
id = "move-tab"
title = "─ Move tab"
placement = "popup"
width = 76
height = 20
command = ["python3", "move_ui.py"]

[[panes]]
id = "move-pane"
title = "─ Move focused pane"
placement = "popup"
width = 88
height = 22
command = ["python3", "pane_ui.py"]

