id = "dotfiles.navigation"
name = "Navigation"
version = "1.4.0"
min_herdr_version = "0.9.5"
description = "Navigate recent tabs and workspaces, and move live tabs or panes"
platforms = ["macos", "linux"]

[[events]]
on = "tab.closed"
command = ["python3", "navigation.py", "closed"]

# Natural shell exit emits pane.exited, not tab.closed, in Herdr 0.9.5.
[[events]]
on = "pane.exited"
command = ["python3", "navigation.py", "closed"]

[[events]]
on = "pane.closed"
command = ["python3", "navigation.py", "closed"]

# Tabs from the mouse button, the API, or pane moves; new-tab places its own.
[[events]]
on = "tab.created"
command = ["python3", "navigation.py", "created"]

[[actions]]
id = "new-tab"
title = "New tab beside current"
contexts = ["workspace"]
command = ["python3", "navigation.py", "new-tab"]

[[actions]]
id = "close-pane"
title = "Close pane"
description = "Close the pane; a last pane returns to the most recent tab"
contexts = ["workspace"]
command = ["python3", "navigation.py", "close-pane"]

[[actions]]
id = "close-tab"
title = "Confirm close tab"
contexts = ["workspace"]
command = ["python3", "navigation.py", "close-tab"]

[[panes]]
id = "close-tab"
# Herdr requires a title; a rule keeps the top border unbroken like its native prompt.
title = "─"
placement = "popup"
width = 64
height = 6
command = ["python3", "navigation.py", "confirm-close-tab"]

[[actions]]
id = "last-tab"
title = "Go to last active tab"
description = "Toggle recent open tabs within the current workspace; scan at most 256 KiB"
contexts = ["workspace"]
command = ["python3", "navigation.py", "last-tab"]

[[actions]]
id = "last-workspace"
title = "Go to last active workspace"
description = "Toggle recent open workspaces within this session; scan at most 256 KiB"
contexts = ["workspace"]
command = ["python3", "navigation.py", "last-workspace"]

[[actions]]
id = "move-tab"
title = "Move tab"
description = "Move the current tab and its live panes to another or a new workspace"
contexts = ["workspace"]
command = ["python3", "move_ui.py", "open"]

[[actions]]
id = "move-pane"
title = "Move focused pane"
description = "Browse workspaces and tabs, or create a destination for the focused pane"
contexts = ["workspace"]
command = ["python3", "pane_ui.py", "open"]

[[actions]]
id = "finish-move"
title = "Finish pending move"
description = "Finish a queued tab or pane move after its popup closes"
contexts = ["workspace"]
command = ["python3", "finish_move.py"]

# Continue the frame before each title so its text aligns with popup content.
[[panes]]
id = "move-tab"
title = "─ Move tab"
placement = "popup"
width = 76
height = 20
command = ["python3", "move_ui.py"]

[[panes]]
id = "move-pane"
title = "─ Move focused pane"
placement = "popup"
width = 88
height = 22
command = ["python3", "pane_ui.py"]

