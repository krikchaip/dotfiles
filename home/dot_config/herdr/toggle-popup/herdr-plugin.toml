id = "dotfiles.toggle-popup"
name = "Toggle popup"
version = "1.0.0"
min_herdr_version = "0.9.5"
description = "Named, persistent popups like tmux-toggle-popup, kept in a private popup session"
platforms = ["macos", "linux"]

# Keys open popups with `[[keys.command]] type = "popup"` lines that run
# toggle.sh (see toggle_popup.py). The plugin has no pane of its own: the
# hooks close the popups of closed tabs and workspaces.

[[events]]
on = "tab.closed"
command = ["python3", "hooks.py", "tab-closed"]

[[events]]
on = "workspace.closed"
command = ["python3", "hooks.py", "workspace-closed"]

[[startup]]
command = ["python3", "hooks.py", "startup"]
