onboarding = false

[experimental]
pane_history = false

[keys]
prefix = "ctrl+;"

[session]
resume_agents_on_restore = true

[terminal]
default_shell = "nu"

[theme]
name = "tokyo-night"

[ui]
pane_borders = "always"
status_indicators = "symbols"
tab_bar_right = [{ type = "command", command = '''case $PWD/ in "$HOME/"*) printf '~%s\n' "${PWD#"$HOME"}";; *) pwd;; esac''', interval_seconds = 2 }]
tab_bar_right_separator = " · "
window_title = "{workspace}: {tab}"

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"
