onboarding = false

[experimental]
pane_history = false

[keys]
prefix = "ctrl+;"
help = "prefix+?"
settings = "prefix+,"
new_workspace = "prefix+shift+t"
new_worktree = ""
open_worktree = ""
remove_worktree = ""
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+ctrl+q"
workspace_picker = "prefix+w"
goto = "prefix+g"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"      # left arrow always focuses the pane to the left
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"     # right arrow always focuses the pane to the right
detach = "prefix+d"
reload_config = "prefix+shift+,"
open_notification_target = "prefix+o"
previous_workspace = "prefix+p"
next_workspace = "prefix+n"
previous_agent = "prefix+k"
next_agent = "prefix+j"
focus_agent = "prefix+1..9"
remote_image_paste = "ctrl+v" # only active in herdr --remote; empty disables raw-key image paste
new_tab = "prefix+t"
rename_tab = "prefix+r"
previous_tab = ["prefix+h", "alt+shift+["]
next_tab = ["prefix+l", "alt+shift+]"]
move_tab_previous = "prefix+shift+["
move_tab_next = "prefix+shift+]"
switch_tab = "alt+shift+1..9"
switch_workspace = "prefix+shift+1..9"
close_tab = "prefix+shift+q"
rename_pane = "prefix+alt+r"
edit_scrollback = "prefix+e"
clear_pane = "prefix+ctrl+k"
copy_mode = "prefix+space"
focus_pane_left = "ctrl+alt+h"
focus_pane_down = "ctrl+alt+j"
focus_pane_up = "ctrl+alt+k"
focus_pane_right = "ctrl+alt+l"
swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"
cycle_pane_next = ""
cycle_pane_previous = ""
last_pane = "alt+tab"
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+q"
zoom = "prefix+z"
resize_mode = "prefix+shift+s"
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""
toggle_sidebar = "prefix+b"

[session]
resume_agents_on_restore = true

[terminal]
default_shell = "nu"

[theme]
name = "tokyo-night"

[ui]
pane_borders = "always"
status_indicators = "symbols"
tab_bar_right = [{ type = "command", command = '''case $PWD/ in "$HOME/"*) printf '~%s\n' "${PWD#"$HOME"}";; *) pwd;; esac''', interval_seconds = 2 }]
tab_bar_right_separator = " · "
window_title = "{workspace}: {tab}"
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false
prompt_new_workspace_name = true
pane_scrollbars = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", { token = "$session_label", fg = "#c0caf5", bold = false, dim = false }, { token = "$session_fallback", fg = "#c0caf5", bold = false, dim = false }],
  [
    { token = "$agent_icon", fg = "#565f89", bold = false, dim = false, rules = [{ equals = "✳", fg = "#d97757" }, { equals = "π", fg = "#9362f4" }] },
    { token = "workspace", fg = "#565f89", bold = false, dim = false },
    { token = "tab", fg = "#565f89", bold = false, dim = false },
  ],
]

[ui.sound]
enabled = true
done_path = "sounds/silent.mp3"

[ui.toast]
delivery = "herdr"

[ui.toast.clipboard]
position = "top-right"

[ui.toast.herdr]
position = "top-right"
