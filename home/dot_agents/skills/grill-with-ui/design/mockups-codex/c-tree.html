      options: [
        { k: "A", text: "Per-session folder under home, keyed by git common root (working directory when not in git). Resume lists unfinished sessions for the project." },
        { k: "B", text: "Inside the repo, gitignored. Lives in one worktree; ws reset wipes it." },
      ],
      rec: { option: "A", why: "Worktree independence decides it here; for adopters it also means zero repo changes." },
      status: "answered", answer: { kind: "accept", option: "A" }, durable: true,
      thread: [
        { who: "user", text: "Hm, what would be easier for other people to adopt?" },
        { who: "agent", text: "Outside the repo, by a wider margin: zero repo changes, one mental model, works outside git, resume is discoverable anyway. Only loss: sessions don't travel with a clone, which is a non-goal." },
      ] },
    q11: { id: "q11", round: 6, title: "Stack", deps: ["q10"],
      body: "What is the server and page built with? Must run the moment the skill is installed.",
      options: [
        { k: "A", text: "Plain Node, no dependencies, no build step. One server script, one self-contained HTML page." },
        { k: "B", text: "Bun. Nicer API, not on most machines." },
        { k: "C", text: "React with a build step." },
      ],
      rec: { option: "A", why: "Claude Code requires Node, so every adopter has it. Polish comes from CSS, not the framework." },
      status: "answered", answer: { kind: "accept", option: "A" }, durable: false, thread: [] },
    q12: { id: "q12", round: 7, title: "Relation to grilling skills", deps: ["q9"],
      body: "How does grill-with-ui relate to the grilling and grill-me skills you already have?",
      options: [
        { k: "A", text: "Self-contained new skill with its own interview prompt (frontier-per-round) plus the page protocol. Developed in its own repo, symlinked in." },
        { k: "B", text: "Composition, Matt-style: invoke grilling plus a protocol skill. Two skills fighting over output format." },
        { k: "C", text: "A flag on grill-me." },
      ],
      rec: { option: "A", why: "One folder, one prompt, nothing to depend on. Publishable later without extraction." },
      status: "answered", answer: { kind: "accept", option: "A" }, durable: false, thread: [] },
    q13: { id: "q13", round: 7, title: "Agent neutrality", deps: ["q11"],
      body: "Claude Code only, or agent-neutral from the start? Codex has no Monitor; Bedrock/Vertex Claude Code lacks it too.",
      options: [
        { k: "A", text: "Add a blocking wait mode to the server now: blocks in the foreground until the next Send, prints it, exits. About twenty lines." },
        { k: "B", text: "Claude Code only for v1." },
      ],
      rec: { option: "A", why: "Cheap, also the fallback for Claude Code without Monitor, keeps the no-lock-in promise." },
      status: "answered", answer: { kind: "accept", option: "A" }, durable: false, thread: [] },
    q14: { id: "q14", round: 7, title: "Build order", deps: ["q13"],
      body: "What gets built first? One assumption is unverified: the harness labels monitor events 'not user input'; the skill prompt says Send events are your answers.",
      options: [
        { k: "A", text: "Spike the wake-up path first: minimal server, one-textarea page, stub prompt with only the event rule. One real round." },
        { k: "B", text: "Build everything, then test end to end." },
      ],
      rec: { option: "A", why: "The only piece that can't be reasoned out from what we already know." },
      status: "answered", answer: { kind: "accept", option: "A" }, durable: false, thread: [] },
    q15: { id: "q15", round: 8, title: "Page visual direction", deps: ["q11"],
      body: "Three mockups are on the table. Which layout carries forward into the spike page?",
      options: [
        { k: "A", text: "Inbox: question list on the left, one detail card on the right, sticky send bar." },
        { k: "B", text: "Scroll: single column of cards grouped by round, outline rail for jumping." },
        { k: "C", text: "Tree + focus: dependency tree on the left, one focused card, thread drawer." },
      ],
      rec: { option: "A", why: "Best fit for 'go back to an earlier question' and it keeps the current question in view while you read history." },
      status: "open", answer: null, durable: false, thread: [] },
    q16: { id: "q16", round: 8, title: "Doc template sections", deps: ["q9"],
      body: "Section order for the generated design doc: Terms, Why, Locked decisions, Routine choices, Deferred, Follow-ups?",
      options: [
        { k: "A", text: "That order, with the header carrying the locked-decision count and the date." },
        { k: "B", text: "Decisions first, Terms at the end as an appendix." },
      ],
      rec: { option: "A", why: "Terms first is what makes cold re-entry work; the header count is your existing convention." },
      status: "open", answer: null, durable: false, updated: true, thread: [] },
    q17: { id: "q17", round: 8, title: "Keyboard shortcuts", deps: ["q15"],
      body: "j/k to move between questions, a/b/c to pick an option, enter to stage, cmd+enter to send?",
      options: [
        { k: "A", text: "Yes, all of them, shown in a footer hint." },
        { k: "B", text: "Defer to after the spike." },
      ],
      rec: { option: "B", why: "Zero cost to add later; not on the critical path." },
      status: "deferred", answer: null, durable: false, thread: [] },
  },
};
</script>
<script>
const mode = document.body.dataset.layout;
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const base = SESSION.questions;
const storageKey = 'grill-codex-mockup-v1-' + mode;
let state = { actions: [], answers: {}, messages: {}, drafts: {} };
try { const saved = JSON.parse(localStorage.getItem(storageKey)); if (saved && Array.isArray(saved.actions) && saved.answers && saved.messages && saved.drafts) state = saved; } catch (_) {}
let selected = 'q15';
let working = false;
let toastTimer;
const expanded = new Set(['q15']);
const save = () => { try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch (_) {} };
const pending = id => state.actions.filter(a => a.q === id);
const stagedAnswer = id => state.actions.find(a => a.q === id && a.type === 'answer');
const committedAnswer = q => state.answers[q.id] || q.answer;
const currentAnswer = q => stagedAnswer(q.id) || committedAnswer(q);
const status = q => state.answers[q.id] ? 'answered' : q.status;
const messages = q => [...q.thread, ...(state.messages[q.id] || []), ...pending(q.id).filter(a => a.type === 'thread').map(a => ({who:'user', text:a.text, staged:true}))];
const symbol = q => status(q) === 'answered' ? '✓' : status(q) === 'deferred' ? '−' : '○';
function navItem(q, tree = false) {
  const info = tree ? `Round ${q.round} · ${status(q)}${q.durable ? ' · Durable' : ''}` : `${status(q)}${q.durable ? ' · Durable' : ''}${q.updated ? ' · Recommendation updated' : ''}`;
  return `<a class="nav-item ${selected === q.id ? 'active' : ''}" href="#${q.id}" data-go="${q.id}" ${selected === q.id ? 'aria-current="true"' : ''}><span class="nav-dot ${status(q)}" aria-hidden="true">${symbol(q)}</span><span class="nav-copy"><span class="nav-title"><span class="qid">${q.id.toUpperCase()}</span>${esc(q.title)}</span><span class="nav-info">${info}${pending(q.id).length ? `<span class="nav-stage">${pending(q.id).length} staged</span>` : ''}</span></span></a>`;
}
function navigation() {
  const answered = Object.values(base).filter(q => status(q) === 'answered').length;
  const heading = mode === 'tree' ? 'Design dependencies' : mode === 'scroll' ? 'Session outline' : 'Questions';
  let html = `<div class="rail-head"><h2>${heading}</h2><p>${answered} answered · ${17-answered} remaining</p><div class="progress"><span style="width:${answered/17*100}%"></span></div><p>8 rounds of decisions</p></div>`;
  if (mode === 'tree') {
    // Each dependency creates an edge. Shared descendants appear under each parent.
    const children = id => Object.values(base).filter(q => q.deps.includes(id));
    const branch = (q, seen = new Set()) => {
      if (seen.has(q.id)) return '';
      const path = new Set(seen); path.add(q.id);
      const next = children(q.id);
      return `<li>${navItem(q,true)}${next.length ? `<ul>${next.map(child => branch(child,path)).join('')}</ul>` : ''}</li>`;
    };
    html += `<ul class="tree-list">${Object.values(base).filter(q => !q.deps.length).map(q => branch(q)).join('')}</ul><div class="tree-legend">Each branch follows a question’s prerequisites.<br>✓ Answered &nbsp; ○ Open &nbsp; − Deferred</div>`;
  } else {
    html += SESSION.rounds.map(r => `<div class="round-label ${r.n === 8 ? 'current' : ''}"><span>Round ${String(r.n).padStart(2,'0')}</span><span>${r.n === 8 ? 'Current' : r.ids.length + ' questions'}</span></div>${r.ids.map(id => navItem(base[id])).join('')}`).join('');
  }
  document.querySelector('.rail').innerHTML = html;
}
function thread(q) {
  const list = messages(q);
  return `<section class="thread" aria-label="Discussion for ${q.id}"><div class="thread-heading"><h3>Discussion</h3><span>${list.length} message${list.length === 1 ? '' : 's'}</span></div>${list.length ? list.map(m => `<div class="message"><span class="avatar" aria-hidden="true">${m.who === 'agent' ? 'A' : 'Y'}</span><div class="message-content"><span class="message-who">${m.who === 'agent' ? 'Agent' : esc(m.who === 'user' ? 'You' : m.who)}</span>${m.staged ? ' <span class="tag staged">Staged</span>' : ''}<p>${esc(m.text)}</p></div></div>`).join('') : '<p class="empty-thread">No messages yet. Explore a trade-off or ask for more context.</p>'}<form class="composer" data-form="thread" data-q="${q.id}"><label class="field-label" for="thread-${q.id}">Add to the discussion</label><textarea id="thread-${q.id}" data-draft="thread:${q.id}" placeholder="Ask a question or add context…" required>${esc(state.drafts['thread:'+q.id] || '')}</textarea><div class="form-foot"><span class="hint">Held here until you send.</span><button class="quiet" type="submit">Stage message</button></div></form></section>`;
}
function answerRecord(q) {
  const answer = currentAnswer(q);
  if (!answer) return '';
  const staged = !!stagedAnswer(q.id);
  const different = answer.option ? answer.option !== q.rec.option : true;
  const option = q.options.find(o => o.k === answer.option);
  return `<div class="answer-record"><strong>${staged ? 'Staged answer' : 'Chosen answer'}${answer.option ? ' · '+esc(answer.option) : ' · Free text'}</strong> ${different ? `<span class="tag diff">${answer.option ? 'Differs from recommendation' : 'Custom answer'}</span>` : ''}${option ? `<p>${esc(option.text)}</p>` : ''}${answer.text ? `<p>${esc(answer.text)}</p>` : ''}${staged ? '<p class="hint">Waiting for Send to Agent.</p>' : ''}</div>`;
}
function card(q) {
  const answer = currentAnswer(q);
  return `<article class="card ${q.id === selected ? 'active' : ''}" id="${q.id}" tabindex="-1" aria-labelledby="title-${q.id}"><div class="card-top"><span class="qid">${q.id.toUpperCase()} / ROUND ${q.round}</span><span class="tag ${status(q)}">${status(q)}</span>${q.durable ? '<span class="tag">◆ Durable</span>' : ''}${q.updated ? '<span class="tag updated">↻ Recommendation updated</span>' : ''}${pending(q.id).length ? `<span class="tag staged">${pending(q.id).length} staged</span>` : ''}</div><h2 id="title-${q.id}">${esc(q.title)}</h2><p class="body-copy">${esc(q.body)}</p><div class="deps"><span>${q.deps.length ? 'Depends on' : 'Root decision · no prerequisites'}</span>${q.deps.map(id => `<a href="#${id}" data-go="${id}">${id.toUpperCase()} · ${esc(base[id].title)}</a>`).join('')}</div><span class="field-label">Choose a direction</span><div class="options">${q.options.map(o => `<button type="button" class="option ${o.k === q.rec.option ? 'recommended' : ''} ${answer?.option === o.k ? 'selected' : ''}" data-option="${o.k}" data-q="${q.id}" aria-pressed="${answer?.option === o.k}" aria-label="Choose ${o.k} for ${q.id}"><span class="letter">${esc(o.k)}</span><span class="option-content"><span class="option-label">${o.k === q.rec.option ? '<span>✦ Recommended</span>' : ''}${answer?.option === o.k ? `<span>✓ ${stagedAnswer(q.id) ? 'Staged choice' : 'Chosen'}</span>` : ''}</span>${esc(o.text)}${o.k === q.rec.option ? `<span class="rationale"><strong>Why this direction.</strong> ${esc(q.rec.why)}</span>` : ''}</span></button>`).join('')}</div><div class="accept-row"><button type="button" class="primary" data-accept="${q.id}">Accept ${esc(q.rec.option)} <span aria-hidden="true">↗</span></button><span class="hint">Stage the agent’s recommendation</span></div>${answerRecord(q)}<form class="text-response" data-form="answer" data-q="${q.id}"><label class="field-label" for="answer-${q.id}">Or write your own answer</label><textarea id="answer-${q.id}" data-draft="answer:${q.id}" placeholder="A different direction, or a refinement…" required>${esc(state.drafts['answer:'+q.id] || '')}</textarea><div class="form-foot"><span class="hint">Your answer stays local until Send.</span><button class="quiet" type="submit">Stage answer</button></div></form>${mode === 'inbox' ? thread(q) : mode === 'scroll' ? `<details class="inline-thread" data-thread="${q.id}" ${expanded.has(q.id) ? 'open' : ''}><summary class="thread-toggle">Discussion · ${messages(q).length} messages</summary>${thread(q)}</details>` : ''}</article>`;
}
function chrome() {
  const count = state.actions.length;
  document.querySelector('.stage-count').textContent = count;
  document.querySelector('.send-copy').innerHTML = `${count ? count + ' action' + (count === 1 ? '' : 's') + ' staged' : 'Nothing staged'}<small>${count ? 'Ready when you are. Send them together.' : 'Answers and messages wait for your Send.'}</small>`;
  const send = document.querySelector('#send');
  send.disabled = !count || working;
  send.textContent = count ? `Send ${count} to Agent` : 'Send to Agent';
  document.querySelector('.agent').textContent = working ? 'Agent working' : 'Agent waiting';
  document.querySelector('.agent').classList.toggle('working', working);
}
function render() {
  navigation();
  if (mode === 'scroll') {
    document.querySelector('.main').innerHTML = `<div class="scroll-intro"><span class="kicker">The decision journal</span><h1>A little clarity,<br>one question at a time.</h1><p>Follow the conversation from the first decision to the current round.<br>Every answer is held until you’re ready to send.</p><span class="doc">Writing toward ${esc(SESSION.doc)}</span></div>${SESSION.rounds.map(r => `<section class="round-section" aria-labelledby="round-${r.n}"><div class="round-heading"><h2 id="round-${r.n}">Round ${String(r.n).padStart(2,'0')}</h2><span>${r.n === 8 ? 'Current round' : r.ids.length+' decisions'}</span></div>${r.ids.map(id => card(base[id])).join('')}</section>`).join('')}`;
  } else {
    const q = base[selected];
    document.querySelector('.main').innerHTML = `<div class="section-top"><div><span class="kicker">${mode === 'tree' ? 'Decision in focus' : 'The conversation'}</span><h1>Round ${String(q.round).padStart(2,'0')}</h1></div><span class="count">${q.id.toUpperCase()} of ${Object.keys(base).length}</span></div>${card(q)}`;
    if (mode === 'tree') document.querySelector('.drawer').innerHTML = `<div class="drawer-context"><span class="kicker">Question thread</span><p>${q.id.toUpperCase()} · ${esc(q.title)}</p></div>${thread(q)}`;
  }
  document.querySelectorAll('details[data-thread]').forEach(d => d.addEventListener('toggle', () => d.open ? expanded.add(d.dataset.thread) : expanded.delete(d.dataset.thread)));
  chrome();
}
function go(id, focus = true) {
  if (!base[id]) return;
  selected = id;
  if (mode === 'scroll') {
    navigation();
    document.querySelectorAll('.card').forEach(el => el.classList.toggle('active',el.id === id));
  } else render();
  const target = document.getElementById(id);
  if (focus) target.focus({preventScroll:true});
  if (mode === 'scroll' || window.innerWidth <= 760) target.scrollIntoView({block:'start'});
  else window.scrollTo(0,0);
  const active = document.querySelector('.rail .active');
  if (active) { const rail = document.querySelector('.rail'); rail.scrollTop += active.getBoundingClientRect().top - rail.getBoundingClientRect().top - rail.clientHeight/2 + active.clientHeight/2; }
}
function toast(message) {
  clearTimeout(toastTimer);
  document.querySelector('.toast').textContent = message;
  toastTimer = setTimeout(() => document.querySelector('.toast').textContent = '', 2800);
}
function refreshKeepingPosition(focusSpec) {
  const y = window.scrollY, railY = document.querySelector('.rail').scrollTop;
  render(); window.scrollTo(0,y); document.querySelector('.rail').scrollTop = railY;
  if (focusSpec) document.querySelector(focusSpec)?.focus({preventScroll:true});
}
function stageAnswer(id, answer, focusSpec) {
  state.actions = state.actions.filter(a => !(a.q === id && a.type === 'answer'));
  state.actions.push({q:id,type:'answer',...answer});
  save(); refreshKeepingPosition(focusSpec); toast(`${id.toUpperCase()} answer staged. Send when you’re ready.`);
}
document.addEventListener('input', e => { if (e.target.dataset.draft) { state.drafts[e.target.dataset.draft] = e.target.value; save(); } });
document.addEventListener('click', e => {
  const link = e.target.closest('[data-go]');
  if (link) { e.preventDefault(); go(link.dataset.go); return; }
  const option = e.target.closest('[data-option]');
  if (option) stageAnswer(option.dataset.q,{kind:'option',option:option.dataset.option},`[data-q="${option.dataset.q}"][data-option="${option.dataset.option}"]`);
  const accept = e.target.closest('[data-accept]');
  if (accept) stageAnswer(accept.dataset.accept,{kind:'accept',option:base[accept.dataset.accept].rec.option},`[data-accept="${accept.dataset.accept}"]`);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]'); if (!form) return;
  e.preventDefault();
  const input = form.querySelector('textarea'); const text = input.value.trim();
  if (!text) { input.setCustomValidity('Write something before staging.'); input.reportValidity(); input.addEventListener('input', () => input.setCustomValidity(''), {once:true}); return; }
  const id = form.dataset.q;
  delete state.drafts[input.dataset.draft];
  if (form.dataset.form === 'answer') stageAnswer(id,{kind:'text',text},`#answer-${id}`);
  else { state.actions.push({q:id,type:'thread',text}); expanded.add(id); save(); refreshKeepingPosition(`#thread-${id}`); toast(`${id.toUpperCase()} message staged. Send when you’re ready.`); }
});
document.querySelector('#send').addEventListener('click', () => {
  if (!state.actions.length || working) return;
  const count = state.actions.length;
  for (const a of state.actions) {
    if (a.type === 'answer') state.answers[a.q] = {kind:a.kind,option:a.option,text:a.text};
    if (a.type === 'thread') (state.messages[a.q] ||= []).push({who:'user',text:a.text});
  }
  state.actions = []; working = true; save(); refreshKeepingPosition();
  toast(`${count} action${count === 1 ? '' : 's'} sent · simulated agent turn`);
  setTimeout(() => { working = false; chrome(); },2200);
});
document.querySelector('.topic').textContent = SESSION.topic;
document.querySelectorAll('[data-doc]').forEach(el => el.textContent = SESSION.doc);
document.querySelector('.project').textContent = SESSION.project;
render();
requestAnimationFrame(() => go('q15'));
</script>
</body></html>
