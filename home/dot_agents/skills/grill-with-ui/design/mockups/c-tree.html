        { k: "C", text: "Tree + focus: dependency tree on the left, one focused card, thread drawer." },
      ],
      rec: { option: "A", why: "Best fit for 'go back to an earlier question' and it keeps the current question in view while you read history." },
      status: "open", answer: null, durable: false, thread: [] },
    q16: { id: "q16", round: 8, title: "Doc template sections", deps: ["q9"],
      body: "Section order for the generated design doc: Terms, Why, Locked decisions, Routine choices, Deferred, Follow-ups?",
      options: [
        { k: "A", text: "That order, with the header carrying the locked-decision count and the date." },
        { k: "B", text: "Decisions first, Terms at the end as an appendix." },
      ],
      rec: { option: "A", why: "Terms first is what makes cold re-entry work; the header count is your existing convention." },
      status: "open", answer: null, durable: false, updated: true, thread: [] },
    q17: { id: "q17", round: 8, title: "Keyboard shortcuts", deps: ["q15"],
      body: "j/k to move between questions, a/b/c to pick an option, enter to stage, cmd+enter to send?",
      options: [
        { k: "A", text: "Yes, all of them, shown in a footer hint." },
        { k: "B", text: "Defer to after the spike." },
      ],
      rec: { option: "B", why: "Zero cost to add later; not on the critical path." },
      status: "deferred", answer: null, durable: false, thread: [] },
  },
};

</script>
<script>
const S = SESSION; const staged = {}; let focus = "q15";
const order = S.rounds.flatMap(r => r.ids);
document.getElementById("doc-path").textContent = "→ " + S.doc;
const count = () => Object.values(staged).reduce((n, s) => n + (s.answer ? 1 : 0) + (s.thread ? s.thread.length : 0), 0);
const stateOf = id => staged[id] ? "staged" : S.questions[id].status;
function children(pid) { return order.filter(id => S.questions[id].deps[0] === pid); }
function treeHtml(ids, root) {
  return `<ul class="t ${root ? "root" : ""}">` + ids.map(id => { const q = S.questions[id];
    return `<li><div class="node ${id === focus ? "focus" : ""} ${q.status === "open" ? "frontier" : ""}" data-go="${id}"><span class="id">${id.toUpperCase()}</span><span>${q.title}</span><span class="s ${stateOf(id)}"></span></div>${children(id).length ? treeHtml(children(id)) : ""}</li>`; }).join("") + `</ul>`;
}
function renderTree() { document.getElementById("tree").innerHTML = treeHtml(order.filter(id => !S.questions[id].deps.length), true); document.querySelectorAll("[data-go]").forEach(n => n.onclick = () => { focus = n.dataset.go; render(); }); }
function renderMain() {
  const q = S.questions[focus]; const st = staged[focus] || {}; const i = order.indexOf(focus);
  const opts = q.options.map(o => `<li class="opt ${q.rec.option === o.k ? "rec" : ""} ${q.answer && q.answer.option === o.k ? "chosen" : ""} ${st.answer && st.answer.option === o.k ? "stg" : ""}" data-opt="${o.k}"><span class="k">${o.k}</span><span>${q.rec.option === o.k ? `<span class="tag">Recommended</span>` : ""}${o.text}</span></li>`).join("");
  const ans = q.status === "answered" ? `<div class="ans"><span class="lbl">answered</span><span>${q.answer.kind === "accept" ? `Accepted recommendation <b>${q.answer.option}</b>.` : q.answer.option ? `Chose <b>${q.answer.option}</b>.` : ""} ${q.answer.text ? `“${q.answer.text}”` : ""}</span>${q.answer.option && q.answer.option !== q.rec.option ? `<span class="against">against rec ${q.rec.option}</span>` : ""}</div>` : "";
  document.getElementById("main").innerHTML = `<article class="focus-card" data-id="${q.id}">
    <div class="meta"><span>${q.id.toUpperCase()} · round ${q.round}</span><span class="pill ${stateOf(q.id)}">${stateOf(q.id)}</span>${q.durable ? `<span class="pill durable">durable</span>` : ""}${q.updated ? `<span class="pill open">rec updated</span>` : ""}<span class="deps">${q.deps.length ? "after " + q.deps.map(d => `<a href="#" data-go2="${d}">${d.toUpperCase()}</a>`).join(", ") : "root"}</span></div>
    <h2>${q.title}</h2>
    <p class="body">${q.body}</p>
    <ul class="opts">${opts}</ul>
    <div class="why"><b>Why ${q.rec.option}</b>${q.rec.why}</div>
    ${ans}
    <div class="row"><textarea id="free" placeholder="${q.status === "answered" ? "Change your answer or add nuance…" : "Free-text answer, if none of the options fit…"}">${st.answer && st.answer.text || ""}</textarea><button class="accept" id="accept">Accept ${q.rec.option}</button><button id="stage-text">Stage text</button></div>
    <div class="pager"><a href="#" data-go2="${order[i - 1] || ""}">${i > 0 ? "← " + order[i - 1].toUpperCase() + " " + S.questions[order[i - 1]].title : ""}</a><a href="#" data-go2="${order[i + 1] || ""}">${i < order.length - 1 ? S.questions[order[i + 1]].title + " " + order[i + 1].toUpperCase() + " →" : ""}</a></div>
  </article>`;
  document.querySelectorAll("[data-go2]").forEach(a => a.onclick = e => { e.preventDefault(); if (a.dataset.go2) { focus = a.dataset.go2; render(); } });
  document.querySelectorAll(".opt").forEach(o => o.onclick = () => stage(q.id, { answer: { kind: "option", option: o.dataset.opt } }));
  document.getElementById("accept").onclick = () => stage(q.id, { answer: { kind: "accept", option: q.rec.option } });
  document.getElementById("stage-text").onclick = () => { const t = document.getElementById("free").value.trim(); if (t) stage(q.id, { answer: { kind: "text", text: t } }); };
}
function renderDrawer() {
  const q = S.questions[focus]; const st = staged[focus] || {};
  const msgs = q.thread.map(m => `<div class="msg ${m.who}"><div class="who">${m.who}</div>${m.text}</div>`).join("") + (st.thread || []).map(t => `<div class="msg user stg"><div class="who">you · staged</div>${t}</div>`).join("");
  document.getElementById("drawer").innerHTML = `<p class="lbl">Thread</p><h3>Dig into <span>${q.id.toUpperCase()}</span> ${q.title}</h3>${msgs || `<p class="empty">No discussion yet. Anything you write here goes to the agent with full session context, tagged to this question.</p>`}
    <div class="row"><textarea id="thread-in" placeholder="Ask a follow-up, push back, or request a lookup…"></textarea><button id="stage-thread">Add to thread</button></div>
    <div class="terms"><p class="lbl">Terms sharpened this session</p>${S.terms.map(t => `<div class="term"><b>${t.term}</b> · ${t.def} <i>avoid: ${t.avoid.join(", ")}</i></div>`).join("")}</div>`;
  document.getElementById("stage-thread").onclick = () => { const t = document.getElementById("thread-in").value.trim(); if (t) { staged[focus] = staged[focus] || {}; (staged[focus].thread = staged[focus].thread || []).push(t); render(); } };
}
function stage(id, patch) { staged[id] = Object.assign(staged[id] || {}, patch); render(); }
function renderFooter() {
  const n = count(); const send = document.getElementById("send"); send.disabled = !n; send.textContent = n ? `Send ${n} to Agent` : "Send to Agent";
  document.getElementById("staged-list").innerHTML = n ? `<b>${n} staged</b> · ` + Object.entries(staged).map(([id, s]) => `${id.toUpperCase()}${s.answer ? " → " + (s.answer.option || "text") : ""}${s.thread ? ` +${s.thread.length} msg` : ""}`).join(" · ") : "Nothing staged. Everything stays local until you send.";
}
function render() { renderTree(); renderMain(); renderDrawer(); renderFooter(); }
document.getElementById("send").onclick = () => {
  const n = count(); for (const k in staged) delete staged[k]; const a = document.getElementById("agent"), t = document.getElementById("toast");
  a.classList.add("working"); a.textContent = "agent working on your batch…"; t.textContent = `Sent ${n} action${n > 1 ? "s" : ""} as one event`; t.classList.add("show"); render();
  setTimeout(() => t.classList.remove("show"), 1800); setTimeout(() => { a.classList.remove("working"); a.textContent = "agent waiting for you · just now"; }, 2600);
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("send").click(); return; }
  const i = order.indexOf(focus);
  if (e.key === "j" && i < order.length - 1) { focus = order[i + 1]; render(); }
  if (e.key === "k" && i > 0) { focus = order[i - 1]; render(); }
  const q = S.questions[focus]; const k = e.key.toUpperCase();
  if (q.options.some(o => o.k === k)) stage(focus, { answer: { kind: "option", option: k } });
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("send").click();
});
render();
</script>
</body>
</html>
