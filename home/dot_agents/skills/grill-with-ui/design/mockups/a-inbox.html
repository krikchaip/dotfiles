  for (const r of S.rounds) {

    const h = document.createElement("div"); h.className = "round" + (isCur ? " current" : "");
    h.innerHTML = `<span>Round ${r.n}${isCur ? " · current" : ""}</span><span>${r.ids.length}</span>`; nav.appendChild(h);
    for (const id of r.ids) {
      const q = S.questions[id]; const st = staged[id];
      const el = document.createElement("div");
      el.className = "item" + (id === selected ? " selected" : "") + (q.updated ? " updated" : "");
      const mark = st ? `<span class="mark staged">staged</span>` : `<span class="mark ${q.status}">${q.status === "answered" ? (q.answer.option || "text") : q.status}</span>`;
      el.innerHTML = `<span class="id">${id.toUpperCase()}</span><span class="t">${q.title}<small>${q.body.slice(0, 54)}…</small></span>${mark}`;
      el.onclick = () => { selected = id; render(); };
      nav.appendChild(el);
    }
  }
}
function renderMain() {
  const q = S.questions[selected]; const st = staged[selected] || {};
  const deps = q.deps.length ? `<span class="deps">after ${q.deps.map(d => `<a href="#" data-go="${d}">${d.toUpperCase()}</a>`).join(", ")}</span>` : `<span>root</span>`;
  const opts = q.options.map(o => {
    const isRec = q.rec.option === o.k; const chosen = q.answer && q.answer.option === o.k; const isStaged = st.answer && st.answer.option === o.k;
    return `<li class="opt ${isRec ? "rec" : ""} ${chosen ? "chosen" : ""} ${isStaged ? "staged" : ""}" data-opt="${o.k}"><span class="k">${o.k}</span><span>${isRec ? `<div class="tag">Recommended</div>` : ""}${o.text}</span></li>`;
  }).join("");
  let answerBlock = "";
  if (q.status === "answered") {
    const against = q.answer.option && q.answer.option !== q.rec.option ? `<span class="against">against rec ${q.rec.option}</span>` : "";
    answerBlock = `<div class="answered-box"><span class="lbl">Answered${against}</span><span>${q.answer.kind === "accept" ? `Accepted recommendation <b>${q.answer.option}</b>. ` : q.answer.option ? `Chose <b>${q.answer.option}</b>. ` : ""}${q.answer.text ? `“${q.answer.text}”` : ""}</span></div>`;
  }
  const thread = q.thread.map(m => `<div class="msg ${m.who}"><span class="who">${m.who}</span><span>${m.text}</span></div>`).join("") +
    (st.thread || []).map(t => `<div class="msg user staged"><span class="who">you · staged</span><span>${t}</span></div>`).join("");
  document.getElementById("main").innerHTML = `
    <article class="card" key="${q.id}">
      <div class="crumb"><span>${q.id.toUpperCase()} · round ${q.round}</span>${deps}${q.durable ? `<span>durable</span>` : ""}</div>
      <h2>${q.title}</h2>
      <p class="body">${q.body}</p>
      <ul class="opts">${opts}</ul>
      <div class="why"><b>Why ${q.rec.option}</b>${q.rec.why}</div>
      ${answerBlock}
      <div class="answer-row">
        <textarea id="free" placeholder="${q.status === "answered" ? "Change your answer, or add nuance…" : "Free-text answer, if none of the options fit…"}">${st.answer && st.answer.text || ""}</textarea>
        <button id="accept">Accept ${q.rec.option}</button>
        <button class="ghost" id="stage-text">Stage text</button>
      </div>
      <section class="thread">
        <h3>Discussion on ${q.id.toUpperCase()} · ${q.thread.length} messages</h3>
        ${thread}
        <div class="answer-row"><textarea id="thread-in" placeholder="Dig deeper on this question without leaving the session…"></textarea><button class="ghost" id="stage-thread">Add to thread</button></div>
      </section>
    </article>`;
  document.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); selected = a.dataset.go; render(); });
  document.querySelectorAll(".opt").forEach(o => o.onclick = () => stage(q.id, { answer: { kind: "option", option: o.dataset.opt } }));
  document.getElementById("accept").onclick = () => stage(q.id, { answer: { kind: "accept", option: q.rec.option } });
  document.getElementById("stage-text").onclick = () => { const t = document.getElementById("free").value.trim(); if (t) stage(q.id, { answer: { kind: "text", text: t } }); };
  document.getElementById("stage-thread").onclick = () => { const t = document.getElementById("thread-in").value.trim(); if (t) { staged[q.id] = staged[q.id] || {}; (staged[q.id].thread = staged[q.id].thread || []).push(t); render(); } };
}
function stage(id, patch) { staged[id] = Object.assign(staged[id] || {}, patch); render(); }
function renderFooter() {
  const n = stagedCount(); const send = document.getElementById("send"); send.disabled = n === 0;
  const parts = Object.entries(staged).map(([id, s]) => `${id.toUpperCase()}${s.answer ? ` ${s.answer.option ? "→ " + s.answer.option : "→ text"}` : ""}${s.thread ? ` +${s.thread.length} msg` : ""}`);
  document.getElementById("staged-list").innerHTML = n ? `<b>${n} staged</b> · ${parts.join(" · ")}` : "Nothing staged. Pick an option, accept a recommendation, or write in a thread.";
  send.textContent = n ? `Send ${n} to Agent` : "Send to Agent";
}
function render() { renderNav(); renderMain(); renderFooter(); }
document.getElementById("send").onclick = () => {
  const n = stagedCount(); for (const k in staged) delete staged[k];
  const dot = document.getElementById("agent-dot"), s = document.getElementById("agent-status"), t = document.getElementById("toast");
  dot.classList.add("working"); s.textContent = "agent working on your batch…"; t.textContent = `Sent ${n} action${n > 1 ? "s" : ""} as one event`; t.classList.add("show");
  render(); setTimeout(() => { t.classList.remove("show"); }, 1800);
  setTimeout(() => { dot.classList.remove("working"); s.textContent = "agent waiting for you · just now"; }, 2600);
};
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("send").click(); });
render();
</script>
</body>
