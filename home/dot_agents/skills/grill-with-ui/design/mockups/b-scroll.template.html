<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grill · grill-with-ui skill · Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d1117; --bg-2: #131a23; --bg-3: #1a2330; --line: #24303f; --fg: #e7ecf3; --fg-2: #9aa7b8; --fg-3: #5f6c7d;
    --amber: #ffb454; --amber-dim: rgba(255,180,84,.14); --cyan: #63d4f5; --cyan-dim: rgba(99,212,245,.12); --green: #7bd88f; --green-dim: rgba(123,216,143,.12); --red: #ff7b72;
    --sans: "Sora", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--sans); background: var(--bg); color: var(--fg); font-size: 14.5px; line-height: 1.55;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 48px 48px; background-position: -1px -1px; }
  body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(900px 500px at 70% -10%, rgba(99,212,245,.10), transparent 60%), radial-gradient(700px 400px at 0% 100%, rgba(255,180,84,.08), transparent 60%); pointer-events: none; }
  .top { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 12px 24px; background: rgba(13,17,23,.85); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .title { display: flex; align-items: baseline; gap: 14px; }
  .top .title h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .top .title .path { font-family: var(--mono); font-size: 12px; color: var(--fg-3); }
  .progress { display: flex; gap: 3px; align-items: center; }
  .progress i { width: 14px; height: 6px; border-radius: 2px; background: var(--bg-3); }
  .progress i.answered { background: var(--green); } .progress i.open { background: var(--amber); } .progress i.staged { background: var(--cyan); } .progress i.deferred { background: var(--fg-3); }
  .progress span { font-family: var(--mono); font-size: 11px; color: var(--fg-2); margin-left: 8px; }
  .agent { font-family: var(--mono); font-size: 12px; color: var(--fg-2); display: flex; gap: 8px; align-items: center; }
  .agent b { color: var(--green); font-weight: 500; } .agent b.working { color: var(--amber); }
  .agent b::before { content: "●"; margin-right: 6px; }
  .layout { display: grid; grid-template-columns: 1fr 72px; max-width: 1180px; margin: 0 auto; padding: 28px 24px 140px; gap: 24px; }
  .rail { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 6px; }
  .rail a { font-family: var(--mono); font-size: 11px; color: var(--fg-3); text-decoration: none; padding: 3px 8px; border-left: 2px solid var(--line); transition: .15s; }
  .rail a:hover, .rail a.active { color: var(--fg); border-left-color: var(--cyan); }
  .rail a.open { color: var(--amber); } .rail a.staged { color: var(--cyan); }
  .rail .r { font-family: var(--mono); font-size: 10px; color: var(--fg-3); margin-top: 8px; letter-spacing: .1em; }
  .round-h { display: flex; align-items: center; gap: 12px; margin: 30px 0 14px; font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--fg-3); }
  .round-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .round-h.current { color: var(--amber); }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px 16px; margin-bottom: 14px; scroll-margin-top: 90px; transition: border-color .2s; position: relative; }
  .card.open { border-color: rgba(255,180,84,.45); box-shadow: 0 0 0 1px rgba(255,180,84,.15), 0 20px 60px -30px rgba(255,180,84,.35); }
  .card.staged { border-color: rgba(99,212,245,.55); }
  .card.answered { opacity: .82; } .card.answered:hover { opacity: 1; }
  .card.deferred { border-style: dashed; opacity: .6; }
  .head { display: flex; align-items: baseline; gap: 12px; }
  .head .id { font-family: var(--mono); font-size: 12px; color: var(--cyan); font-weight: 700; }
  .head h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .head .deps { font-family: var(--mono); font-size: 11px; color: var(--fg-3); margin-left: auto; }
  .head .deps a { color: var(--fg-2); text-decoration: none; } .head .deps a:hover { color: var(--cyan); }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
  .pill.open { background: var(--amber-dim); color: var(--amber); } .pill.answered { background: var(--green-dim); color: var(--green); } .pill.deferred { background: var(--bg-3); color: var(--fg-2); } .pill.staged { background: var(--cyan-dim); color: var(--cyan); } .pill.updated { background: var(--amber-dim); color: var(--amber); }
  .body { color: var(--fg-2); margin: 8px 0 0; max-width: 78ch; }
  .card.answered .body, .card.answered .opts, .card.answered .why { display: none; }
  .card.answered.expanded .body, .card.answered.expanded .opts, .card.answered.expanded .why { display: block; }
  .opts { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 6px; }
  .opt { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 9px 12px; border-radius: 7px; background: var(--bg-3); border: 1px solid transparent; cursor: pointer; transition: .12s; }
  .opt:hover { border-color: var(--fg-3); }
  .opt .k { font-family: var(--mono); font-weight: 700; color: var(--fg-2); }
  .opt.rec { border-color: rgba(255,180,84,.5); background: linear-gradient(90deg, var(--amber-dim), var(--bg-3) 50%); } .opt.rec .k { color: var(--amber); }
  .opt.rec .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-right: 8px; }
  .opt.chosen { border-color: var(--green); } .opt.stg { border-color: var(--cyan); background: var(--cyan-dim); }
  .why { margin: 10px 0 0; font-size: 13.5px; color: var(--fg-2); padding-left: 12px; border-left: 2px solid var(--amber); }
  .why b { color: var(--amber); font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin-right: 8px; }
  .ans { margin-top: 12px; display: flex; gap: 10px; align-items: baseline; font-size: 14px; }
  .ans .lbl { font-family: var(--mono); font-size: 11px; color: var(--green); letter-spacing: .1em; text-transform: uppercase; }
  .ans .against { font-family: var(--mono); font-size: 11px; color: var(--red); }
  .row { display: flex; gap: 8px; margin-top: 12px; align-items: flex-start; }
  textarea { flex: 1; min-height: 44px; font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--cyan); }
  button { font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg-3); color: var(--fg); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--fg-3); }
  button.accept { border-color: var(--amber); color: var(--amber); }
  button.primary { background: var(--cyan); color: #06222b; border-color: var(--cyan); font-weight: 700; }
  button.primary:disabled { background: var(--bg-3); color: var(--fg-3); border-color: var(--line); cursor: default; }
  details { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
  summary { cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--fg-3); letter-spacing: .1em; text-transform: uppercase; list-style: none; display: flex; gap: 8px; align-items: center; }
  summary::before { content: "▸"; color: var(--fg-3); } details[open] summary::before { content: "▾"; }
  summary .n { color: var(--cyan); }
  .msg { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 8px 0; font-size: 13.5px; }
  .msg .who { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); padding-top: 3px; }
  .msg.agent .who { color: var(--amber); } .msg.user .who { color: var(--cyan); }
  .msg.stg { background: var(--cyan-dim); border-radius: 6px; padding: 8px; }
  .toggle { position: absolute; top: 16px; right: 16px; font-family: var(--mono); font-size: 11px; color: var(--fg-3); cursor: pointer; }
  .card.answered .toggle::after { content: "expand"; } .card.answered.expanded .toggle::after { content: "collapse"; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 24px; background: rgba(13,17,23,.9); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  .bar .list { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--fg-2); }
  .bar .list b { color: var(--cyan); }
  .bar .hint { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
  .toast { position: fixed; right: 24px; bottom: 72px; padding: 9px 12px; background: var(--cyan); color: #06222b; font-family: var(--mono); font-size: 12px; font-weight: 700; border-radius: 6px; opacity: 0; transition: .25s; transform: translateY(6px); }
  .toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
<div class="top">
  <div class="title"><h1>grill: grill-with-ui skill</h1><span class="path" id="doc-path"></span></div>
  <div class="progress" id="progress"></div>
  <div class="agent" id="agent"><b>waiting for you</b><span>since 22:41</span></div>
</div>
<div class="layout">
  <div id="feed"></div>
  <div class="rail" id="rail"></div>
</div>
<div class="bar">
  <span class="list" id="staged-list">Nothing staged.</span>
  <span class="hint">j/k jump · ⌘↩ send</span>
  <button id="finish">Finish grill</button>
  <button class="primary" id="send" disabled>Send to Agent</button>
</div>
<div class="toast" id="toast"></div>
<script>
/*__DATA__*/
</script>
<script>
const S = SESSION; const staged = {}; const expanded = new Set();
document.getElementById("doc-path").textContent = "→ " + S.doc;
const count = () => Object.values(staged).reduce((n, s) => n + (s.answer ? 1 : 0) + (s.thread ? s.thread.length : 0), 0);
const stateOf = id => staged[id] ? "staged" : S.questions[id].status;
function renderTop() {
  document.getElementById("progress").innerHTML = Object.keys(S.questions).map(id => `<i class="${stateOf(id)}" title="${id}"></i>`).join("") +
    `<span>${Object.values(S.questions).filter(q => q.status === "answered").length}/${Object.keys(S.questions).length} settled</span>`;
}
function renderRail() {
  document.getElementById("rail").innerHTML = S.rounds.map(r => `<span class="r">R${r.n}</span>` + r.ids.map(id => `<a href="#${id}" class="${stateOf(id)}">${id.toUpperCase()}</a>`).join("")).join("");
}
function card(q) {
  const st = staged[q.id] || {}; const cls = staged[q.id] ? "staged" : q.status;
  const opts = q.options.map(o => `<li class="opt ${q.rec.option === o.k ? "rec" : ""} ${q.answer && q.answer.option === o.k ? "chosen" : ""} ${st.answer && st.answer.option === o.k ? "stg" : ""}" data-q="${q.id}" data-opt="${o.k}"><span class="k">${o.k}</span><span>${q.rec.option === o.k ? `<span class="tag">rec</span>` : ""}${o.text}</span></li>`).join("");
  const ans = q.status === "answered" ? `<div class="ans"><span class="lbl">answered</span><span>${q.answer.kind === "accept" ? `accepted <b>${q.answer.option}</b>` : q.answer.option ? `chose <b>${q.answer.option}</b>` : ""}${q.answer.text ? ` “${q.answer.text}”` : ""}</span>${q.answer.option && q.answer.option !== q.rec.option ? `<span class="against">against rec ${q.rec.option}</span>` : ""}</div>` : "";
  const thread = q.thread.map(m => `<div class="msg ${m.who}"><span class="who">${m.who}</span><span>${m.text}</span></div>`).join("") + (st.thread || []).map(t => `<div class="msg user stg"><span class="who">you · staged</span><span>${t}</span></div>`).join("");
  const stagedPill = staged[q.id] ? `<span class="pill staged">staged</span>` : `<span class="pill ${q.status}">${q.status}</span>`;
  return `<article class="card ${cls} ${expanded.has(q.id) ? "expanded" : ""}" id="${q.id}">
    <div class="head"><span class="id">${q.id.toUpperCase()}</span><h2>${q.title}</h2>${stagedPill}${q.updated ? `<span class="pill updated">rec updated</span>` : ""}<span class="deps">${q.deps.length ? "after " + q.deps.map(d => `<a href="#${d}">${d.toUpperCase()}</a>`).join(" ") : "root"}</span></div>
    ${q.status === "answered" ? `<span class="toggle" data-toggle="${q.id}"></span>` : ""}
    <p class="body">${q.body}</p>
    <ul class="opts">${opts}</ul>
    <div class="why"><b>why ${q.rec.option}</b>${q.rec.why}</div>
    ${ans}
    ${q.status !== "answered" || expanded.has(q.id) ? `<div class="row"><textarea data-free="${q.id}" placeholder="Free-text answer…">${st.answer && st.answer.text || ""}</textarea><button class="accept" data-accept="${q.id}">accept ${q.rec.option}</button><button data-stagetext="${q.id}">stage text</button></div>` : ""}
    <details ${q.thread.length || st.thread ? "open" : ""}><summary>thread <span class="n">${q.thread.length + (st.thread || []).length}</span></summary>${thread}
      <div class="row"><textarea data-thread="${q.id}" placeholder="Dig deeper on ${q.id.toUpperCase()}…"></textarea><button data-stagethread="${q.id}">add to thread</button></div></details>
  </article>`;
}
function renderFeed() {
  document.getElementById("feed").innerHTML = S.rounds.map(r => `<div class="round-h ${r.n === S.rounds.length ? "current" : ""}"><span>Round ${r.n}${r.n === S.rounds.length ? " · current frontier" : ""}</span></div>` + r.ids.map(id => card(S.questions[id])).join("")).join("");
  document.querySelectorAll("[data-toggle]").forEach(t => t.onclick = () => { const id = t.dataset.toggle; expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); });
  document.querySelectorAll(".opt").forEach(o => o.onclick = () => stage(o.dataset.q, { answer: { kind: "option", option: o.dataset.opt } }));
  document.querySelectorAll("[data-accept]").forEach(b => b.onclick = () => stage(b.dataset.accept, { answer: { kind: "accept", option: S.questions[b.dataset.accept].rec.option } }));
  document.querySelectorAll("[data-stagetext]").forEach(b => b.onclick = () => { const t = document.querySelector(`[data-free="${b.dataset.stagetext}"]`).value.trim(); if (t) stage(b.dataset.stagetext, { answer: { kind: "text", text: t } }); });
  document.querySelectorAll("[data-stagethread]").forEach(b => b.onclick = () => { const id = b.dataset.stagethread; const t = document.querySelector(`[data-thread="${id}"]`).value.trim(); if (t) { staged[id] = staged[id] || {}; (staged[id].thread = staged[id].thread || []).push(t); render(); } });
}
function stage(id, patch) { staged[id] = Object.assign(staged[id] || {}, patch); render(); }
function renderBar() {
  const n = count(); const send = document.getElementById("send"); send.disabled = !n; send.textContent = n ? `send ${n} to agent` : "Send to Agent";
  document.getElementById("staged-list").innerHTML = n ? `<b>${n} staged</b> · ` + Object.entries(staged).map(([id, s]) => `${id.toUpperCase()}${s.answer ? " → " + (s.answer.option || "text") : ""}${s.thread ? ` +${s.thread.length}` : ""}`).join(" · ") : "Nothing staged. Everything you do here stays local until you send.";
}
function render() { const y = window.scrollY; renderTop(); renderRail(); renderFeed(); renderBar(); window.scrollTo(0, y); }
document.getElementById("send").onclick = () => {
  const n = count(); for (const k in staged) delete staged[k]; const a = document.getElementById("agent"), t = document.getElementById("toast");
  a.innerHTML = `<b class="working">working on your batch</b>`; t.textContent = `sent ${n} action${n > 1 ? "s" : ""} as one event`; t.classList.add("show"); render();
  setTimeout(() => t.classList.remove("show"), 1800); setTimeout(() => { a.innerHTML = `<b>waiting for you</b><span>just now</span>`; }, 2600);
};
document.addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") document.getElementById("send").click(); });
render(); setTimeout(() => document.getElementById("q15").scrollIntoView({ block: "center" }), 50);
</script>
</body>
</html>
