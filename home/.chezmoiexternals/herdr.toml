# Herdr palettes for each plugin's herdr_theme.py, which reads herdr-src/
# next to itself. The version in the URL refetches on a Herdr upgrade.
{{- if lookPath "herdr" }}
{{-   $version := output "herdr" "--version" | trim | splitList " " | last }}
{{-   $base := printf "https://raw.githubusercontent.com/herdrdev/herdr/v%s/src" $version }}
{{-   $sources := dict "state.rs" "app/state.rs" "theme.rs" "config/theme.rs" }}
{{-   range $plugin := list "navigation" "toggle-popup" }}
{{-     range $file, $path := $sources }}

[".config/herdr/{{ $plugin }}/herdr-src/{{ $file }}"]
  type = "file"
  url = "{{ $base }}/{{ $path }}"
{{-     end }}
{{-   end }}
{{- end }}
